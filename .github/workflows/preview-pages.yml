name: Publish game previews

on:
  push:
    branches: [master]
  workflow_run:
    workflows: [PR game build]
    types: [completed]
  pull_request_target:
    branches: [master]
    types: [closed]
  workflow_dispatch:

# Queue all classroom submissions instead of replacing the previous pending run.
concurrency:
  group: game-preview-pages
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # On every trigger, including PR closure, only load trusted default-branch code.
      - name: Check out the publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select an eligible event and artifact
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const result = await require('./.github/scripts/preview.cjs').select({ github, context });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            return result;
      - name: Install Nix for the master game
        if: steps.select.outputs.mode == 'master'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Test and build the master game
        if: steps.select.outputs.mode == 'master'
        run: |
          nix develop -c just test
          nix develop -c just test-previews
          nix build
      - name: Download only this build's artifact
        if: steps.select.outputs.mode == 'build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.select.outputs.artifactId }}
          run-id: ${{ steps.select.outputs.runId }}
          github-token: ${{ github.token }}
          path: incoming-game
      - name: Validate the game and preserve the preview collection
        if: steps.select.outputs.mode != 'skip'
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SELECTION: ${{ steps.select.outputs.result }}
        with:
          script: |
            const result = await require('./.github/scripts/preview.cjs').prepare({
              github, context, selection: JSON.parse(process.env.SELECTION),
              directory: 'incoming-game', masterFile: 'result/index.html'
            });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            return result;
      - name: Check out the assembled static site
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.commit }}
          path: preview-site
          persist-credentials: false
      - name: Configure Pages
        if: steps.prepare.outputs.publish == 'true'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the complete site
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: preview-site
          include-hidden-files: true
      - name: Deploy the previews
        if: steps.prepare.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Link the game from the PR
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW: ${{ steps.prepare.outputs.result }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        with:
          script: |
            await require('./.github/scripts/preview.cjs').notify({
              github, context, core, preview: JSON.parse(process.env.PREVIEW), baseUrl: process.env.PAGES_URL
            });
