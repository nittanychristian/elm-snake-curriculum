<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Curved swordfish body</title>
  <desc id="desc">A quarter-circle body connecting the left and top cell edges, each from 28 to 72. Rotate around the cell center for other corners.</desc>
  <defs>
    <radialGradient id="bend-skin" cx="0" cy="0" r="72" gradientUnits="userSpaceOnUse">
      <stop offset=".388889" stop-color="#f58160"/>
      <stop offset=".663889" stop-color="#ffb88a"/>
      <stop offset=".847222" stop-color="#ffd5a0"/>
      <stop offset="1" stop-color="#ffe8bd"/>
    </radialGradient>
  </defs>
  <!-- Annular arcs preserve the straight tile's width at both joining edges. -->
  <path fill="url(#bend-skin)" d="M0 28A28 28 0 0 0 28 0H72A72 72 0 0 1 0 72Z"/>
  <path fill="#ed795e" d="M0 28A28 28 0 0 0 28 0H34A34 34 0 0 1 0 34Z"/>
  <path fill="#fff0c8" d="M0 66A66 66 0 0 0 66 0H72A72 72 0 0 1 0 72Z"/>
  <g fill="none" stroke="#e9916c" stroke-width="1.6" stroke-linecap="round" opacity=".65">
    <path d="M12 39Q20 43 15 50M28 29Q37 30 37 39M39 12Q48 12 50 19"/>
    <path d="M12 55Q20 60 17 64M36 45Q45 46 46 54M53 24Q62 23 65 30"/>
  </g>
  <g fill="#ffe8b5" opacity=".9">
    <ellipse cx="12" cy="42" rx="4" ry="1.5" transform="rotate(-16 12 42)"/>
    <ellipse cx="29" cy="32" rx="4" ry="1.5" transform="rotate(-43 29 32)"/>
    <ellipse cx="42" cy="12" rx="4" ry="1.5" transform="rotate(-74 42 12)"/>
  </g>
</svg>
