  <title id="dragon-tail-title">Blue lightning dragon tail</title>
  <desc id="dragon-tail-desc">An armored sapphire tail tapering left to an icy spear point, with white lightning. Its right edge connects to the body from y 28 to 72 and lightning at y 50.</desc>
