<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Repeating eagle body</title>
  <desc id="desc">A warm brown feathered body tile with matching edges from y 28 to 72, designed to repeat horizontally.</desc>
  <defs>
    <linearGradient id="eagle-body-skin" x1="0" y1="28" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c332b"/>
      <stop offset=".45" stop-color="#805237"/>
      <stop offset=".75" stop-color="#b9824e"/>
      <stop offset="1" stop-color="#e6cba0"/>
    </linearGradient>
  </defs>
  <path fill="url(#eagle-body-skin)" d="M0 28H100V72H0Z"/>
  <path fill="#432d27" d="M0 28H100V34H0Z"/>
  <path fill="#efdab2" d="M0 66H100V72H0Z"/>
  <!-- Staggered, backward-pointing feathers stop short of the joining edges. -->
