    <path d="M18 51Q9 50 2 57Q9 64 20 59L14 57Z"/>
    <path d="M43 51Q34 50 27 57Q34 64 45 59L39 57Z"/>
    <path d="M68 51Q59 50 52 57Q59 64 70 59L64 57Z"/>
    <path d="M93 51Q84 50 77 57Q84 64 95 59L89 57Z"/>
  </g>
  <path d="M12 42L21 41M37 42L46 41M62 42L71 41M87 42L96 41M6 57L14 55M31 57L39 55M56 57L64 55M81 57L89 55" fill="none" stroke="#e3bd84" stroke-width="1.4" stroke-linecap="round"/>
</svg>
