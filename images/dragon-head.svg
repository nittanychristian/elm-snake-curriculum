<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="dragon-head-title dragon-head-desc">
  <title id="dragon-head-title">Blue lightning dragon head</title>
  <desc id="dragon-head-desc">A right-facing sapphire dragon with sculpted reptilian armor, swept ivory-blue horns, an ice-blue slit eye, nostrils, and a fanged jaw. White lightning crosses its neck. The left connection spans y 28 to 72 with lightning at y 50.</desc>
  <defs>
    <linearGradient id="dh-neck" x1="0" y1="28" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071a49"/><stop offset=".15" stop-color="#124b9d"/><stop offset=".36" stop-color="#48bcec"/><stop offset=".49" stop-color="#1878c5"/><stop offset=".76" stop-color="#09438d"/><stop offset=".94" stop-color="#071e50"/><stop offset="1" stop-color="#133668"/>
    </linearGradient>
    <linearGradient id="dh-face" x1="48" y1="27" x2="70" y2="77" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8de6ff"/><stop offset=".19" stop-color="#369bd9"/><stop offset=".47" stop-color="#1766af"/><stop offset=".76" stop-color="#0a3878"/><stop offset="1" stop-color="#061d46"/>
    </linearGradient>
    <linearGradient id="dh-horn" x1="26" y1="10" x2="41" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf1"/><stop offset=".3" stop-color="#d8f5ff"/><stop offset=".65" stop-color="#74b7d6"/><stop offset="1" stop-color="#174571"/>
    </linearGradient>
    <linearGradient id="dh-cheek" x1="39" y1="43" x2="57" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61cffa"/><stop offset=".45" stop-color="#217ac2"/><stop offset="1" stop-color="#082f68"/>
    </linearGradient>
    <radialGradient id="dh-eye"><stop stop-color="#fff"/><stop offset=".45" stop-color="#a9f8ff"/><stop offset="1" stop-color="#20a4de"/></radialGradient>
    <pattern id="dh-scales" width="20" height="16" patternUnits="userSpaceOnUse">
      <g fill="none" stroke-linejoin="round">
        <path d="M-10 0Q0 17 10 0Q20 17 30 0M-20 8Q-10 25 0 8Q10 25 20 8Q30 25 40 8" stroke="#042858" stroke-width=".85" opacity=".65"/>
        <path d="M-8 1Q0 12 8 1M12 1Q20 12 28 1M2 9Q10 20 18 9" stroke="#96e9ff" stroke-width=".6" opacity=".43"/>
      </g>
    </pattern>
  </defs>
